<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slate</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233A4429'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2.5' fill='none' stroke='%23E9EBD8' stroke-width='2'/%3E%3Cpath d='M11 15h10M11 19h6' stroke='%23E9EBD8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  body{padding:0}
  .pwrap{max-width:560px;margin:0 auto;padding:28px 18px 70px}
  .pbrand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:20px}
  .pbrand .m{width:30px;height:30px;border-radius:9px;background:var(--olive-700);display:grid;place-items:center}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
  .phead h1{font-size:25px}
  .ava-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px}
  .ava-img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:2px solid var(--olive-200);background:var(--paper-3)}
  .ava-ph{width:104px;height:104px;border-radius:50%;background:var(--paper-3);display:grid;place-items:center;font-size:34px}
  .viewer{position:fixed;inset:0;background:rgba(35,38,28,.6);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
  .viewer.on{display:flex}
  .viewer .box{background:var(--paper);border-radius:16px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:14px}
  .viewer .bar{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);cursor:pointer;font-size:17px;flex:none}
</style>
</head>
<body>
<div class="pwrap">
  <div class="pbrand">
    <span class="m"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="5" width="18" height="14" rx="2.6" fill="none" stroke="#E9EBD8" stroke-width="2"/><path d="M7 11h10M7 15h6" stroke="#E9EBD8" stroke-width="2" stroke-linecap="round"/></svg></span>
    <span>Slate</span>
  </div>
  <div id="pview"></div>
</div>
<input type="file" id="pfile" hidden>
<div class="viewer" id="viewer"><div class="box" id="viewerBox"></div></div>
<script src="/static/portal.js"></script>
</body>
</html>
