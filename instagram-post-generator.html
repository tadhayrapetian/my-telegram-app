<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram-ի հրապարակումների գեներատոր</title>
<style>
  :root {
    --bg: #f2f2f7; --panel: #ffffff; --text: #1c1c1e; --muted: #8e8e93;
    --border: #d1d1d6; --accent: #0a84ff; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #2c2c2e; --text: #f2f2f7;
      --muted: #98989d; --border: #3a3a3c;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  .app { display: flex; height: 100vh; }

  .controls {
    width: 400px; min-width: 400px; height: 100vh; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border); padding: 22px;
  }
  h1 { font-size: 19px; font-weight: 700; margin-bottom: 14px; line-height: 1.3; }
  .lang { display: flex; gap: 6px; margin-bottom: 20px;
    background: var(--bg); padding: 4px; border-radius: 10px; }
  .lang button {
    flex: 1; padding: 8px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--text); font-size: 14px; font-weight: 600;
  }
  .lang button.active { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

  .section { margin-bottom: 22px; }
  .section > .title {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }

  /* Գեներացիայի բլոկ / generator block */
  .gen-box { background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  .chip { padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px;
    font-family: inherit; }
  .chip.active { background: var(--accent); color: #fff; border-color: transparent; }

  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 13px; margin-bottom: 5px; }
  input[type=text], textarea {
    width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text); resize: vertical;
  }
  .gen-box input[type=text] { background: var(--panel); }
  textarea { min-height: 60px; background: var(--bg); }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

  button.btn {
    width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
    font-size: 15px; font-weight: 600; font-family: inherit; margin-bottom: 10px;
  }
  button.btn.generate {
    background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: #fff;
    font-size: 16px; padding: 14px; margin-bottom: 0;
    box-shadow: 0 4px 14px rgba(74,0,224,.35);
  }
  button.btn.generate:active { transform: scale(.99); }
  button.btn.primary { background: var(--accent); color: #fff; }
  button.btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }

  .themes { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .swatch { height: 42px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; }
  .swatch.active { border-color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .seg { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 8px; }
  .seg button { padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--text); font-size: 13px; font-family: inherit; }
  .seg button.active { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
  .formats { display: flex; flex-direction: column; gap: 8px; }
  .formats button { text-align: left; padding: 11px 13px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--bg); color: var(--text); font-size: 14px;
    cursor: pointer; font-family: inherit; }
  .formats button.active { border-color: var(--accent); background: rgba(10,132,255,.08); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 44px; height: 30px; border: 1px solid var(--border);
    border-radius: 6px; background: none; cursor: pointer; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .status { font-size: 14px; font-weight: 600; color: #34c759; margin-top: 8px; min-height: 18px; }

  .preview { flex: 1; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 30px; gap: 14px; }
  .preview .label { font-size: 14px; font-weight: 600; color: var(--muted); }
  #canvas { max-width: 100%; max-height: calc(100vh - 90px);
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="app">
  <div class="controls">
    <h1 id="appTitle"></h1>
    <div class="lang">
      <button id="langHy" class="active" onclick="setLang('hy')">🇦🇲 Հայերեն</button>
      <button id="langEn" onclick="setLang('en')">🇬🇧 English</button>
    </div>

    <!-- ✨ ԳԵՆԵՐԱՑԻԱ / GENERATOR -->
    <div class="gen-box">
      <div class="title" data-t="generator" style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px"></div>
      <label class="field" style="margin-bottom:8px"><span data-t="topic"></span>
        <input type="text" id="topic" placeholder=""></label>
      <div class="chips" id="chips"></div>
      <button class="btn generate" id="genBtn" onclick="generatePost()"></button>
    </div>

    <!-- Արդյունք (խմբագրելի) / result (editable) -->
    <div class="section">
      <div class="title" data-t="content"></div>
      <label class="field"><span data-t="title"></span>
        <input type="text" id="title" oninput="draw()"></label>
      <label class="field"><span data-t="subtitle"></span>
        <input type="text" id="subtitle" oninput="draw()"></label>
      <label class="field"><span data-t="caption"></span>
        <textarea id="caption"></textarea></label>
    </div>

    <div class="section">
      <div class="title" data-t="style"></div>
      <label class="field"><span data-t="theme"></span></label>
      <div class="themes" id="themes"></div>
      <div class="row" style="margin-top:12px">
        <span style="font-size:13px" data-t="textColor"></span>
        <input type="color" id="textColor" value="#ffffff" oninput="draw()">
      </div>
      <label class="field"><span data-t="alignment"></span>
        <div class="seg" id="alignSeg">
          <button data-align="left" onclick="setAlign('left')"></button>
          <button data-align="center" class="active" onclick="setAlign('center')"></button>
          <button data-align="right" onclick="setAlign('right')"></button>
        </div>
      </label>
      <label class="field"><span id="fontSizeLabel"></span>
        <input type="range" id="fontSize" min="40" max="160" step="2" value="88" oninput="draw()"></label>
    </div>

    <div class="section">
      <div class="title" data-t="format"></div>
      <div class="formats" id="formats"></div>
    </div>

    <div class="section">
      <div class="title" data-t="hashtags"></div>
      <textarea id="hashtags" style="min-height:56px"></textarea>
      <button class="btn secondary" id="copyHashBtn" onclick="copyHashtags()" style="margin-top:8px"></button>
    </div>

    <div class="section">
      <div class="title" data-t="export"></div>
      <button class="btn primary" id="downloadBtn" onclick="downloadPNG()"></button>
      <button class="btn secondary" id="copyCapBtn" onclick="copyCaption()"></button>
      <div class="hint" data-t="exportHint"></div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="preview">
    <div class="label" data-t="preview"></div>
    <canvas id="canvas" width="1080" height="1080"></canvas>
  </div>
</div>

// ================== Վիճակ / State ==================
let lang = "hy", theme = THEMES[0], align = "center", format = "square", category = "general";

function tr(k){ return T[k][lang]; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function sample(arr, n){
  const copy = arr.slice(); const out = [];
  while (out.length < n && copy.length) out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
  return out;
}

// ================== ✨ Հիմնական գեներացիա / MAIN GENERATION ==================
function generatePost(){
  const topic = document.getElementById("topic").value.trim();
  const data = CATEGORIES[category][lang];

  // Վերնագիր / title
  let title;
  if (topic) title = pick(data.titlesTopic).replace("{topic}", topic);
  else title = pick(data.titlesNoTopic);

  // Ենթավերնագիր / subtitle
  const subtitle = pick(data.subtitles);

  // Caption = 2 նախադասություն + կոչ գործողության
  const caption = sample(data.captions, 2).join(" ") + "\n\n" + pick(data.cta);

  // Հեշթեգներ = թեմայից բխող + կատեգորիայի
  const topicTags = topic.toLowerCase()
    .split(/[^a-zа-яё0-9ա-և]+/i)
    .filter(w => w.length >= 3).slice(0, 3).map(w => "#"+w);
  const seen = new Set(topicTags);
  const tags = topicTags.slice();
  for (const t of sample(data.tags, data.tags.length)) {
    if (tags.length >= 10) break;
    if (!seen.has(t)) { seen.add(t); tags.push(t); }
  }

  // Գույն ընտրվում է կատեգորիային համապատասխան / theme matched to category
  const themeId = pick(CATEGORIES[category].themes);
  theme = THEMES.find(t => t.id === themeId) || theme;

  // Լրացնում ենք դաշտերը / fill fields
  document.getElementById("title").value = title;
  document.getElementById("subtitle").value = subtitle;
  document.getElementById("caption").value = caption;
  document.getElementById("hashtags").value = tags.join(" ");
  buildThemes();
  draw();
  status("saved"); // կարճ բռնկում — «պատրաստ է»
  document.getElementById("status").textContent = lang==="hy" ? "Գեներացվեց ✓" : "Generated ✓";
}

// ================== UI կառուցում / build ==================
function buildChips(){
  const box = document.getElementById("chips");
  box.innerHTML = "";
  Object.keys(CATEGORIES).forEach(id => {
    const c = document.createElement("button");
    c.className = "chip" + (id===category ? " active":"");
    c.textContent = CATEGORIES[id].emoji + " " + CATEGORIES[id].name[lang];
    c.onclick = () => { category = id; buildChips(); };
    box.appendChild(c);
  });
}
function buildThemes(){
  const box = document.getElementById("themes"); box.innerHTML = "";
  THEMES.forEach(th => {
    const d = document.createElement("div");
    d.className = "swatch" + (th.id===theme.id ? " active":"");
    d.style.background = `linear-gradient(135deg, ${th.c[0]}, ${th.c[1]})`;
    d.onclick = () => { theme = th; buildThemes(); draw(); };
    box.appendChild(d);
  });
}
function buildFormats(){
  const box = document.getElementById("formats"); box.innerHTML = "";
  Object.keys(FORMATS).forEach(id => {
    const b = document.createElement("button");
    b.className = (id===format ? "active":""); b.textContent = tr(id);
    b.onclick = () => { format = id; buildFormats(); draw(); };
    box.appendChild(b);
  });
}
function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("appTitle").textContent = tr("appTitle");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = tr(el.getAttribute("data-t")));
  document.querySelectorAll("#alignSeg button").forEach(b => {
    const a = b.getAttribute("data-align");
    b.textContent = tr(a==="left"?"alignLeft":a==="center"?"alignCenter":"alignRight");
  });
  document.getElementById("topic").placeholder = tr("topicPh");
  document.getElementById("genBtn").textContent = tr("generate");
  document.getElementById("copyHashBtn").textContent = tr("copyHash");
  document.getElementById("downloadBtn").textContent = tr("download");
  document.getElementById("copyCapBtn").textContent = tr("copyCap");
  updateFontLabel(); buildChips(); buildFormats();
}
function setLang(l){
  lang = l;
  document.getElementById("langHy").classList.toggle("active", l==="hy");
  document.getElementById("langEn").classList.toggle("active", l==="en");
  applyLang();
}
function setAlign(a){
  align = a;
  document.querySelectorAll("#alignSeg button").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-align")===a));
  draw();
}
function updateFontLabel(){
  document.getElementById("fontSizeLabel").textContent =
    tr("fontSize") + ": " + document.getElementById("fontSize").value;
}

// ================== Նկարում / draw ==================
function wrapText(ctx, text, maxWidth){
  const lines = [];
  text.split("\n").forEach(par => {
    const words = par.split(" "); let line = "";
    words.forEach(w => {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
      else line = test;
    });
    lines.push(line);
  });
  return lines;
}
function draw(){
  updateFontLabel();
  const {w, h} = FORMATS[format];
  const canvas = document.getElementById("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");

  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, theme.c[0]); g.addColorStop(1, theme.c[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.beginPath(); ctx.arc(w*0.95, h*0.05, w*0.30, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.beginPath(); ctx.arc(w*0.05, h*0.92, w*0.20, 0, Math.PI*2); ctx.fill();

  const pad = w * 0.09;
  const color = document.getElementById("textColor").value;
  const titleSize = parseInt(document.getElementById("fontSize").value, 10);
  const subSize = Math.round(titleSize * 0.45);
  const title = document.getElementById("title").value;
  const subtitle = document.getElementById("subtitle").value;
  const maxW = w - pad*2;
  const fontStack = '-apple-system, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif';

  ctx.textBaseline = "top";
  ctx.textAlign = align;
  const x = align==="left" ? pad : align==="right" ? w - pad : w/2;

  ctx.font = `700 ${titleSize}px ${fontStack}`;
  const titleLines = title ? wrapText(ctx, title, maxW) : [];
  ctx.font = `500 ${subSize}px ${fontStack}`;
  const subLines = subtitle ? wrapText(ctx, subtitle, maxW) : [];

  const titleLH = titleSize * 1.15, subLH = subSize * 1.25;
  const gap = titleLines.length && subLines.length ? titleSize * 0.4 : 0;
  const totalH = titleLines.length*titleLH + gap + subLines.length*subLH;
  let y = (h - totalH) / 2;

  ctx.font = `700 ${titleSize}px ${fontStack}`;
  ctx.fillStyle = color;
  ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = w*0.012; ctx.shadowOffsetY = w*0.005;
  titleLines.forEach(line => { ctx.fillText(line, x, y); y += titleLH; });
  y += gap;

  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.font = `500 ${subSize}px ${fontStack}`;
  ctx.fillStyle = hexWithAlpha(color, 0.9);
  subLines.forEach(line => { ctx.fillText(line, x, y); y += subLH; });
}
function hexWithAlpha(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// ================== Գործողություններ / actions ==================
function status(key){
  const s = document.getElementById("status");
  const msg = tr(key); s.textContent = msg;
  setTimeout(() => { if (s.textContent === msg) s.textContent = ""; }, 2500);
}
function downloadPNG(){
  draw();
  const link = document.createElement("a");
  link.download = "instagram-post.png";
  link.href = document.getElementById("canvas").toDataURL("image/png");
  link.click(); status("saved");
}
function copyHashtags(){
  navigator.clipboard.writeText(document.getElementById("hashtags").value); status("copied");
}
function copyCaption(){
  const cap = document.getElementById("caption").value;
  const hash = document.getElementById("hashtags").value;
  navigator.clipboard.writeText(cap + (hash ? "\n\n"+hash : "")); status("copied");
}

applyLang();
buildThemes();
generatePost(); // Ծրագիրն ինքն է ստեղծում առաջին գրառումը / the app generates the first post itself
